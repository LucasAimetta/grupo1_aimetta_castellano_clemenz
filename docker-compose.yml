version: '3.8'

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: mi_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  backend:
    build: 
      context: . 
      dockerfile: backend/Dockerfile 
    container_name: mi_backend
    ports:
      - "8080:8080" 
    env_file:
      - path: .env
        required: false
    environment:
      - MONGO_URI
      - ELASTIC_URL
      - ELASTIC_API_KEY
      - FRONTEND_URL
      - PORT
      - REDIS_URL
      - SESSION_TTL_HOURS
      - RECIPE_SYNC_CRON
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URL
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mi_frontend
    ports:
      - "3000:3000" 
    depends_on:
      - backend

volumes:
  es_data:
  redis_data: